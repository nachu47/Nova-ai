name: Keep alive

# Pings the backend twice a day. /health/ready runs a database query, which keeps
# the free Supabase project from pausing and wakes the free Render instance.
on:
  schedule:
    - cron: "0 3 * * *"   # 08:30 IST
    - cron: "0 15 * * *"  # 20:30 IST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health check
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "Set the BACKEND_URL repository secret, e.g. https://your-app.onrender.com"; exit 1
          fi
          # A sleeping Render instance can take ~60s to start, so allow long timeouts and retries.
          curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
            "${BACKEND_URL%/}/api/v1/health/ready"
