user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","request":"$request","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,"request_id":"$request_id"}';
  access_log /var/log/nginx/access.log json;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 25m;
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream api { server backend:8000; keepalive 32; }
  upstream web { server frontend:80; keepalive 16; }

  server {
    listen 80 default_server;
    server_name _;

    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }

    location /api/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /metrics { proxy_pass http://api/metrics; allow 172.16.0.0/12; deny all; }
    location / { proxy_pass http://web; proxy_set_header Host $host; }
  }

  # Production TLS: mount fullchain.pem and privkey.pem into nginx/certs, then
  # enable a 443 server using ssl_protocols TLSv1.2 TLSv1.3 and redirect port 80.
}
